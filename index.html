<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agentic RAG Assistant — Diamond Edition</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        :root {
            --gold-primary: #ffd700;
            --gold-light: #fff2a3;
            --gold-dark: #b8860b;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --diamond-glow: rgba(255, 215, 0, 0.25);
            --glass-bg: rgba(18, 18, 24, 0.65);
            --glass-border: rgba(255, 215, 0, 0.3);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #08080c;
            color: var(--text-main);
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Glowing Background Orbs */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            pointer-events: none;
        }

        .bg-orb-1 {
            width: 400px;
            height: 400px;
            background: rgba(184, 134, 11, 0.25);
            top: -100px;
            left: -100px;
        }

        .bg-orb-2 {
            width: 500px;
            height: 500px;
            background: rgba(218, 165, 32, 0.15);
            bottom: -150px;
            right: -100px;
        }

        /* Glassmorphism Diamond Container */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 850px;
            padding: 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.8),
                0 0 30px var(--diamond-glow),
                inset 0 0 15px rgba(255, 215, 0, 0.1);
            transition: all 0.4s ease;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--gold-gradient);
            border-radius: 24px 24px 0 0;
        }

        /* Header Styling */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 30px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold-light);
            margin-bottom: 15px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.1);
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            font-weight: 800;
            background: var(--gold-gradient);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .description {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 300;
        }

        /* Input Glass Area */
        .input-group {
            position: relative;
            margin-top: 25px;
        }

        textarea {
            width: 100%;
            min-height: 140px;
            padding: 20px;
            background: rgba(10, 10, 15, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 16px;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1rem;
            resize: vertical;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        textarea::placeholder {
            color: #64748b;
        }

        textarea:focus {
            border-color: var(--gold-primary);
            box-shadow: 
                inset 0 2px 10px rgba(0, 0, 0, 0.5),
                0 0 20px rgba(255, 215, 0, 0.3);
        }

        /* Diamond Gold Button */
        button {
            width: 100%;
            margin-top: 20px;
            padding: 16px 28px;
            border: none;
            border-radius: 14px;
            font-family: 'Cinzel', serif;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #000000;
            background: var(--gold-gradient);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(218, 165, 32, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(255, 215, 0, 0.6);
            filter: brightness(1.1);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #334155;
            color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Dynamic Status Section */
        #status {
            margin-top: 20px;
            font-size: 0.95rem;
            text-align: center;
            min-height: 24px;
            transition: all 0.3s ease;
        }

        .status-loading {
            color: var(--gold-light);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .status-success {
            color: #4ade80;
        }

        .error {
            color: #f87171 !important;
        }

        /* Pulse Loader */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-top: 2px solid var(--gold-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Output Glass Display */
        #answer {
            display: none;
            margin-top: 25px;
            padding: 25px;
            border-radius: 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.25);
            box-shadow: 
                inset 0 0 15px rgba(0, 0, 0, 0.6),
                0 0 15px rgba(255, 215, 0, 0.05);
            white-space: pre-wrap;
            line-height: 1.7;
            font-size: 1rem;
            color: #f1f5f9;
            animation: fadeIn 0.5s ease forwards;
        }

        .answer-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Cinzel', serif;
            color: var(--gold-primary);
            font-size: 1.1rem;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.15);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>

    <main class="container">
        <header class="header">
            <div class="brand-badge">
                <i class="fa-solid fa-gem"></i> Autonomous Intelligence
            </div>
            <h1>Agentic RAG Assistant</h1>
            <p class="description">
                Ask any query to invoke deep web research, real-time synthesis, and dynamic knowledge retrieval.
            </p>
        </header>

        <div class="input-group">
            <textarea
                id="query"
                placeholder="Example: What are the latest breakthroughs in agentic RAG and LLM orchestration?"
            ></textarea>
        </div>

        <button id="askButton">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Execute Research
        </button>

        <div id="status"></div>
        
        <div id="answer">
            <div class="answer-header">
                <i class="fa-solid fa-brain"></i> Intelligence Output
            </div>
            <div id="answerContent"></div>
        </div>
    </main>

    <script>
        const API_URL = "http://127.0.0.1:8000/predict";

        const queryInput = document.getElementById("query");
        const askButton = document.getElementById("askButton");
        const statusElement = document.getElementById("status");
        const answerContainer = document.getElementById("answer");
        const answerContent = document.getElementById("answerContent");

        async function askQuestion() {
            const query = queryInput.value.trim();

            if (!query) {
                statusElement.textContent = "Please enter a question to begin research.";
                statusElement.className = "error";
                return;
            }

            askButton.disabled = true;
            statusElement.className = "status-loading";
            statusElement.innerHTML = `<div class="spinner"></div> Agents orchestrating research & synthesizing data...`;
            answerContainer.style.display = "none";
            answerContent.textContent = "";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        query: query
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Request execution failed.");
                }

                answerContent.textContent = data.output;
                answerContainer.style.display = "block";
                statusElement.className = "status-success";
                statusElement.innerHTML = `<i class="fa-solid fa-circle-check"></i> Research compiled successfully.`;

            } catch (error) {
                statusElement.textContent = `Error: ${error.message}`;
                statusElement.className = "error";
            } finally {
                askButton.disabled = false;
            }
        }

        askButton.addEventListener("click", askQuestion);

        queryInput.addEventListener("keydown", function(event) {
            if (event.key === "Enter" && event.ctrlKey) {
                askQuestion();
            }
        });
    </script>
</body>
</html>
